name: linkbot-discord

services:
  docker-proxy:
    image: haproxy:lts-alpine
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [bot-internal]
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    environment:
      DOCKER_PROXY_URL: http://docker-proxy:2375
    networks: [bot-internal]
    depends_on: [docker-proxy]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  test-server:
    image: alpine
    container_name: vrising11
    profiles: [test]
    command: sleep infinity
    networks: [bot-internal]

networks:
  bot-internal:
    driver: bridge
