name: linkbot-discord

services:
  docker-proxy:
    image: haproxy:lts-alpine
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [bot-internal]
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    environment:
      DOCKER_PROXY_URL: http://docker-proxy:2375
    networks: [bot-internal]
    depends_on: [docker-proxy]
    restart: unless-stopped
    # On a bad .env the bot halts (instead of crash-looping) and writes this marker.
    healthcheck:
      test: ["CMD", "test", "!", "-f", "/tmp/config-error"]
      interval: 30s
      start_period: 10s

  test-server:
    image: alpine
    container_name: vrising11
    profiles: [test]
    command: sleep infinity
    networks: [bot-internal]

networks:
  bot-internal:
    driver: bridge
